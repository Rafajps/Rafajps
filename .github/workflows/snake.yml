name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/contribution-grid-snake.svg?color_snake=%2338BDF8&color_dots=%230D1117%230A2A43%230E7490%2338BDF8%237DD3FC

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Commit Snake
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update contribution snake"
          add: "profile/*.svg"
